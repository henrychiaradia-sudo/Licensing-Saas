name: CI

# Roda a cada push na main e em pull requests: typecheck + testes das fórmulas + build.
# É a "rede de segurança" — se alguma fórmula ou o build quebrar, o check falha e avisa.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Testes · Build
    runs-on: ubuntu-latest
    # Variáveis fictícias: o build/testes não abrem conexão real (postgres é preguiçoso).
    env:
      DATABASE_URL: postgres://user:pass@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build (next)
        run: npm run build
